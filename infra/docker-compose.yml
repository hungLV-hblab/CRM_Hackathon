name: crm-hackathon

# The database URLs are built HERE rather than taken from `.env`, and that is deliberate.
# The `.env` copies point at `localhost:5432` because the host-side tools need them there —
# `pnpm test:unit`, `pnpm seed`, psql. Inside the compose network the same database answers
# to the name `postgres`. One file cannot hold both, so the host keeps `.env` and the
# containers get their addresses from the block below.
x-database-urls: &database-urls
  DATABASE_URL_OWNER: postgres://crm_owner:${CRM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm}
  DATABASE_URL_APP: postgres://crm_app:${CRM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm}
  DATABASE_URL_SYSTEM: postgres://crm_system:${CRM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm}

# Both the API (Sales presses ingest) and the worker (watch cycle) reach the LLM, so the key
# belongs to both or the same snapshot gets read by a real model on one path and by the fixture
# on the other. Deliberately `:-` and not `:?`: with no key the provider falls back to the
# fixture adapter, which is the documented rollback and the reason a judge who was never given
# a key can still run the acceptance suite. Boot logs say which adapter won — do not guess.
x-llm-access: &llm-access
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}

x-api-image: &api-image
  build:
    # Repository root: a pnpm workspace package cannot build from its own directory.
    context: ..
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}
      # Read by postgres-init/01-roles.sh to set the password of the three crm_* roles.
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?CRM_DB_PASSWORD is missing from .env}
    ports:
      # Exposed to the host so `pnpm test:unit` and `pnpm seed` can run from the machine.
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init scripts only run on an EMPTY volume. An old volume means no roles → `down -v` first.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-crm}']
      interval: 3s
      timeout: 3s
      retries: 20

  # A one-shot job, not a step inside the API's start-up. Two long-running services racing to
  # apply the same migration is a real failure and an ugly one to read in the logs; a job that
  # both of them wait to see EXIT SUCCESSFULLY removes the race instead of narrowing it.
  migrate:
    <<: *api-image
    restart: 'no'
    environment:
      <<: *database-urls
    # Migrations run as crm_owner — the only role that may own the schema (ADR-0010).
    command: ['node', '../../packages/db/dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      <<: [*database-urls, *llm-access]
      APP_ROLE: api
      API_PORT: 3001
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is missing from .env — generate one with openssl rand -hex 32}'
    # No published port: the only way in is through Caddy on :8080, which is exactly the path
    # a judge's browser takes. Exposing 3001 as well would let a bug hide behind the proxy.
    expose:
      - '3001'
    depends_on:
      migrate:
        condition: service_completed_successfully

  # SAME image as `api`, different APP_ROLE (ADR-0011). Its own container so that
  # `docker compose logs -f worker` shows the watch cycle and nothing else.
  worker:
    <<: *api-image
    environment:
      <<: [*database-urls, *llm-access]
      APP_ROLE: worker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing from .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

volumes:
  postgres-data:
